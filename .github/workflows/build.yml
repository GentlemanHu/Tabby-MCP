name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate
        run: npm run check

      - name: Create release archive
        run: |
          mkdir -p release/tabby-mcp-server/scripts
          cp -r dist release/tabby-mcp-server/
          cp -r typings release/tabby-mcp-server/
          cp package.json release/tabby-mcp-server/
          cp scripts/stdio-bridge.js release/tabby-mcp-server/scripts/
          cd release && zip -r ../tabby-mcp-${{ github.ref_name }}.zip tabby-mcp-server
          cd .. && tar -czvf tabby-mcp-${{ github.ref_name }}.tar.gz -C release tabby-mcp-server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabby-mcp-build
          path: |
            dist/
            typings/
            package.json

      # A tag containing a hyphen (v1.6.3-rc.1, v2.0.0-beta.2) is a prerelease.
      # Prereleases are published to GitHub only and never to npm.
      - name: Classify release
        id: classify
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=("tabby-mcp-${{ github.ref_name }}.zip" "tabby-mcp-${{ github.ref_name }}.tar.gz")
          PRE_FLAG=()
          if [[ "${{ steps.classify.outputs.prerelease }}" == "true" ]]; then
            PRE_FLAG=(--prerelease)
          fi
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${ASSETS[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${ASSETS[@]}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --latest \
              "${PRE_FLAG[@]}"
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && steps.classify.outputs.prerelease == 'false'
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          rm -f "${NPM_CONFIG_USERCONFIG:-}" .npmrc
          # Trusted publishing needs npm 11.5.1+; Node 22 ships npm 10, which only knows token auth.
          npm install -g npm@11.5.1
          npm --version
          npm publish --access public --provenance

  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate
        run: npm run check
