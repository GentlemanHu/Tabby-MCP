name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate
        run: npm run check

      - name: Create release archive
        run: |
          mkdir -p release/tabby-mcp-server
          cp -r dist release/tabby-mcp-server/
          cp -r typings release/tabby-mcp-server/
          cp package.json release/tabby-mcp-server/
          cd release && zip -r ../tabby-mcp-${{ github.ref_name }}.zip tabby-mcp-server
          cd .. && tar -czvf tabby-mcp-${{ github.ref_name }}.tar.gz -C release tabby-mcp-server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabby-mcp-build
          path: |
            dist/
            typings/
            package.json

      # A tag containing a hyphen (v1.6.3-rc.1, v2.0.0-beta.2) is a prerelease.
      # Prereleases are published to GitHub only and never to npm.
      - name: Classify release
        id: classify
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tabby-mcp-${{ github.ref_name }}.zip
            tabby-mcp-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.classify.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && steps.classify.outputs.prerelease == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate
        run: npm run check
